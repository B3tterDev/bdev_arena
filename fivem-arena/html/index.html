<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena HUD</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============================================================
     HUD BAR  (Score / Round / Streak / Countdown)
     แสดงตลอดระหว่างเกม — ซ่อนตอน idle
     ============================================================ -->
<div id="hud-bar" class="hud hidden">
    <div class="hud-round">
        Round <span id="hud-round-num">1</span>/<span id="hud-round-total">3</span>
    </div>

    <div class="hud-scores">
        <span class="hud-red">🔴 <span id="hud-red-score">0</span></span>
        <span class="hud-vs">VS</span>
        <span class="hud-blue"><span id="hud-blue-score">0</span> 🔵</span>
    </div>

    <div id="hud-streak"    class="hud-streak hidden"></div>
    <div id="hud-countdown" class="hud-countdown hidden"></div>
</div>

<!-- ============================================================
     RESULT OVERLAY  (แสดงตอนจบเกม แล้วหายไปเอง)
     ============================================================ -->
<div id="result-overlay" class="result-overlay hidden">
    <div class="result-card">
        <div id="result-title"  class="result-title">จบเกม!</div>
        <div id="result-winner" class="result-winner"></div>
        <div class="result-scores">
            <div class="result-score red-score">🔴 <span id="result-red">0</span></div>
            <div class="result-score blue-score">🔵 <span id="result-blue">0</span></div>
        </div>
        <div id="result-pool" class="result-pool"></div>
        <div class="result-dismiss">ปิดอัตโนมัติใน <span id="result-timer">8</span> วินาที</div>
    </div>
</div>

<script src="js/ui.js"></script>
</body>
</html>
